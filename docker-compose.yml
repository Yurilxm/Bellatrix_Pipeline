services:
  bellatrix-api:
    build: .
    container_name: bellatrix-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8012/health', timeout=8)"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    environment:
      # Configurações do Whisper (CPU)
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      # Garante que pywhispercpp use CPU
      GGML_CPU_ALL: "1"
    ports:
      - "127.0.0.1:8012:8012"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - default

networks:
  default:
    external: true
    name: infra-stack_default